# ============================================================
# Pull request: chỉ chạy test.
# Push lên main: chạy test → test qua thì đưa thư mục site/ lên Cloudflare Pages.
# Test hỏng thì KHÔNG deploy, trang cũ vẫn giữ nguyên.
#
# Secrets cần có trong repo (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token chỉ có quyền "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID  ID tài khoản Cloudflare
# ============================================================
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Tải code về runner
        uses: actions/checkout@v7

      - name: Cài Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Chạy test
        run: npm test

  deploy:
    name: Deploy
    needs: test
    # Chỉ deploy code của nhánh main. Kiểm tra theo nhánh (không theo loại sự kiện)
    # để cả nút "Run workflow" chạy từ nhánh khác cũng không đẩy được lên production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Đặt ở cấp job (không phải cấp workflow) để chỉ các lần deploy xếp hàng với nhau;
    # test của pull request không chen vào hàng chờ và làm huỷ lần deploy đang chờ.
    concurrency:
      group: production
      cancel-in-progress: false
    environment:
      name: production
      # Project tên "wedding-party", nhưng subdomain đó đã có người dùng
      # nên Cloudflare cấp địa chỉ có thêm đuôi "-cmq".
      url: https://wedding-party-cmq.pages.dev
    steps:
      - name: Tải code về runner
        uses: actions/checkout@v7

      - name: Cài Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # Ghim major version (@4): bản wrangler mới có thay đổi lớn cũng không làm hỏng
      # deploy bất ngờ. --branch=main khớp production branch của project → lên bản chính.
      - name: Deploy lên Cloudflare Pages
        run: >-
          npx --yes wrangler@4 pages deploy site
          --project-name=wedding-party
          --branch=main
          --commit-hash=${{ github.sha }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
